## MSEL duplicate-order regression fixture. Uses MIMX95 resource names (PD_M7, CPU_M7P).
## Exercises four scenarios in LM1 MSEL0:
##   1. PD_M7 and CPU_M7P both at start order 2  -> DUP_ORDER ERROR (start side)
##   2. PD_M7 at start orders 1, 2, and 3        -> DUP_RSRC ERROR (start side)
##   3. PD_M7 stop=1, CPU_M7P stop=3             -> gap at stop order 2, NON_CONSECUTIVE WARNING
##   4. CPU_M7P and PD_M7 both at stop order 3   -> DUP_ORDER + DUP_RSRC (stop side, round-trip check)

MAKE    soc=MIMX95, board=mcimx95evk, build=gcc_cross
DOX     name=MSEL_DUP_ORDER, desc="MSEL duplicate order regression test"

include ../devices/MIMX95/configtool/device.cfg

NOTIFY:             api=notify
GET:                api=get
SET:                api=set
PRIV:               api=priv
ALL:                api=all
DFMT0:              sa=bypass
DFMT1:              sa=bypass, pa=user

BOARD               DEBUG_UART_INSTANCE=0
BOARD               DEBUG_UART_BAUDRATE=115200
BOARD               I2C_INSTANCE=0
BOARD               I2C_BAUDRATE=100000

#==========================================================================#
# SM (standard scaffolding — same shape as minimal_mx95.cfg)               #
#==========================================================================#

DOM0                name="ELE", did=0

LM0                 name="SM", rpc=none, boot=1, did=2, safe=feenv

# LM0 needs both mSel=0 (implicit) and mSel=1 boot entries to satisfy the model.
MODE                msel=1, boot=1

DFMT0:              sa=secure
DFMT1:              sa=secure, pa=privileged
OWNER:              perm=sec_rw, api=all

M33P                OWNER

#==========================================================================#
# M7 — duplicate-order and duplicate-resource scenarios                   #
#==========================================================================#

LM1                 name="M7", rpc=none, boot=2, did=4

# Scenarios 1+2: PD_M7 at start=1,2,3 with CPU_M7P sharing start=2 -> DUP_ORDER at 2 and DUP_RSRC on PD_M7
PD_M7               start=1
PD_M7               start=2
CPU_M7P             start=2
PD_M7               start=3

# Scenarios 3+4: gap at stop=2; stop=3 shared by CPU_M7P and PD_M7 (duplicate + same-resource across orders 1 and 3)
PD_M7               stop=1
CPU_M7P             stop=3
PD_M7               stop=3
