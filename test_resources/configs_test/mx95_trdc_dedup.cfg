## TRDC Deduplication Test Configuration
##
## Tests TRDC deduplication behavior across ALL resource types when multiple
## agents on the same LM assign identical resources.
##
## Base: Includes minimal_mx95.cfg (provides LM0/SM, LM1/TEST, DOM0/ELE)
## This config adds LM2 with 2 SCMI agents to test comprehensive deduplication.
##
## Test scenario (2 agents on LM2/AP domain, did=3):
##   SCMI_AGENT1 (REF): Manually assigns all resource types:
##     - MRC (Memory Region Checker): DDR regions
##     - MBC Block: GPIO2, LPUART1 (single block assignments)
##     - MBC Range: TRDC_A (range 0.39-40)
##     - MBC Memory: M33_TCM_CODE (memory block controller)
##     - MDAC: NPU (master domain assignment)
##     - BCTRL: LPIT1 (block control via macro resource)
##
##   SCMI_AGENT2 (DUP): Assigns IDENTICAL resources as AGENT1
##
## Expected: Generated TRDC register writes should be deduplicated where both
## agents assign the same resource with the same permissions. This verifies
## that deduplication works correctly across all TRDC resource types.
##
## Known diffs vs Perl:
##   - MDAC NPU: Perl emits SM_CFG_W1(0x00000880U), 0xA3400013U twice (once per
##     agent REF and DUP); SMCT deduplicates to single write with both owners in
##     comment. Functionally equivalent (idempotent register write).
##   - MRC DDR: Perl emits duplicate RGD entry for 0x08000000 region; SMCT
##     deduplicates to one entry. Functionally equivalent.
##   - No errors or warnings should be generated for same-DID same-params dedup.

include minimal_mx95.cfg

#==========================================================================#
# LM2 - AP Domain with Agent Duplication Test                             #
#==========================================================================#

LM2                 name="AP", rpc=scmi, boot=2, did=3, default
OWNER:              perm=rw, api=all

#==========================================================================#
# SCMI Agent 1 (REF) - Manual resource assignment                         #
#==========================================================================#

SCMI_AGENT1         name="REF"
MAILBOX             type=mu, mu=1, test=0
CHANNEL             db=0, xport=smt, rpc=scmi, type=a2p
CHANNEL             db=1, xport=smt, rpc=scmi, type=p2a_notify

# API
SYS                 ALL

# Resources - MU for agent
MU1_A               OWNER

# MBC Block (single) - Peripherals with single MBC entry
GPIO2               OWNER
LPUART1             OWNER

# MBC Range - Peripheral with range-based MBC (0.39-40)
TRDC_A              OWNER

# MBC Memory - TCM memory block controller
M33_TCM_CODE        perm=rw, begin=0x201C0000, end=0x201DFFFF

# MDAC - Master domain assignment controller (NPU)
NPU                 OWNER, kpa=0, sid=0x0d

# BCTRL - Block control (via macro resource LPIT1)
LPIT1               OWNER

# MRC - Memory Region Checker (DDR) - single region for dedup testing
DDR                 perm=full, begin=0x080000000, end=0x083FFFFFF

#==========================================================================#
# SCMI Agent 2 (DUP) - Identical resource assignment                      #
#==========================================================================#
# This agent assigns IDENTICAL resources as AGENT1 to verify that SMCT
# correctly deduplicates TRDC register writes across all resource types.

SCMI_AGENT2         name="DUP"
MAILBOX             type=mu, mu=3, test=2
CHANNEL             db=0, xport=smt, rpc=scmi, type=a2p
CHANNEL             db=1, xport=smt, rpc=scmi, type=p2a_notify

# API - Same as AGENT1
SYS                 ALL

# Resources - IDENTICAL to AGENT1
MU1_A               OWNER

# MBC Block (single)
GPIO2               OWNER
LPUART1             OWNER

# MBC Range
TRDC_A              OWNER

# MBC Memory
M33_TCM_CODE        perm=rw, begin=0x201C0000, end=0x201DFFFF

# MDAC
NPU                 OWNER, kpa=0, sid=0x0d

# BCTRL
LPIT1               OWNER

# MRC - DDR assignments (AGENT2 has additional range to test non-dedup)
DDR                 perm=full, begin=0x080000000, end=0x083FFFFFF
# Additional range not assigned by AGENT1 → separate RGD entry
DDR                 perm=rw, begin=0x084000000, end=0x087FFFFFF
