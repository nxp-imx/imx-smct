# Test CFG: Duplicate TRDC resource assignment via two agents in same LM
# Purpose: Verify deduplication of identical register writes (MBC, MRC, MDAC)
#          AND detect conflicting MDAC writes when agents differ in DFMT attrs.
# Use case: LM2 has two agents (AP-S, AP-NS) that assign the same resource
#           with the same permission. The tool should:
#           1. Detect conflicting permissions (different DFMT = error)
#           2. Deduplicate identical register writes (same perm = one write)
#
# Base: Includes minimal_mx95.cfg (provides LM0/SM, LM1/TEST, DOM0/ELE)
# This config adds LM2 with 2 SCMI agents having different security attributes.

include minimal_mx95.cfg

#==========================================================================#
# A55 Domain (LM2) — two agents assigning same TRDC resources              #
#==========================================================================#

LM2                 name="AP", rpc=scmi, boot=3, did=3, default

DFMT0:              sa=bypass
DFMT1:              sa=secure, pa=privileged
OWNER:              perm=rw, api=all
DATA:               perm=rw

#==========================================================================#
# SCMI Agent 1 (AP-S) — Secure Agent                                      #
#==========================================================================#

SCMI_AGENT1         name="AP-S", secure
MAILBOX             type=mu, mu=1, test=0
CHANNEL             db=0, xport=smt, rpc=scmi, type=a2p
CHANNEL             db=1, xport=smt, rpc=scmi, type=p2a_notify

# API
SYS                 ALL

# Resources (MBC — assigned to domain 3 with perm=rw)
A55C0               OWNER
A55P                OWNER
ARM_PLL             OWNER
MU1_A               OWNER
LPUART1             OWNER
GPIO2               OWNER

# Memory (MRC — same range + same perm as AP-NS)
DDR                 DATA, begin=0x080000000, end=0x083FFFFFF

# MDAC resource (NPU assigned with kpa=0, sid=0x0d)
NPU                 OWNER, kpa=0, sid=0x0d

#==========================================================================#
# SCMI Agent 2 (AP-NS) — Non-Secure Agent, same DID=3                     #
# Different DFMT attrs → MDAC conflict expected                            #
#==========================================================================#

DFMT0:              sa=nonsecure
DFMT1:              sa=nonsecure, pa=privileged

SCMI_AGENT2         name="AP-NS"
MAILBOX             type=mu, mu=3, test=2
CHANNEL             db=0, xport=smt, rpc=scmi, type=a2p
CHANNEL             db=1, xport=smt, rpc=scmi, type=p2a_notify

# API
SYS                 NOTIFY

# Resources (MBC — SAME resources as AP-S, same perm=rw → should deduplicate)
LPUART1             OWNER
GPIO2               OWNER

# Memory (MRC — SAME range + same perm as AP-S → should deduplicate)
DDR                 DATA, begin=0x080000000, end=0x083FFFFFF

# MDAC resource (NPU — same params but different DFMT → conflict expected)
NPU                 OWNER, kpa=0, sid=0x0d
