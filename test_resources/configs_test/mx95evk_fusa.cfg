## SM configuration file for MX95 with FUSA tasks (SMCT-only test)

include minimal_mx95.cfg

# FUSA Configuration Constants
FUSA_DEF  WATCHDOG_TIMEOUT=5000, comment="Watchdog timeout in ms"
FUSA_DEF  MAX_RECOVERY_ATTEMPTS=3, comment="Max recovery attempts"
FUSA_DEF  SAFETY_LEVEL="SIL2", comment="Safety integrity level"

# FUSA Scheduler Tasks
FUSA_TASK  task=FUSA_WATCHDOG_CHECK, period=10ms, type=handler, comment="Watchdog check task"
FUSA_TASK  task=FUSA_MEMORY_SCRUB, period=100ms, type=handler, comment="Memory scrub task"
FUSA_TASK  task=FUSA_DIAG_REPORT, period=1s, type=thread, comment="Diagnostic report task"
