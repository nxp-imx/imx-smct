## Minimal SIMU configuration for SMCT test fixtures
## This is the most basic configuration possible for testing
## Note: simu device has known limitations with TRDC domain assignments

MAKE    soc=simu, board=simu, build=gcc_simu
DOX     name=MINIMAL_SIMU, desc="Minimal Simulation Test Configuration"

include ../devices/simu/configtool/device.cfg

# Common access templates
NOTIFY:             api=notify
GET:                api=get
SET:                api=set
PRIV:               api=priv
ALL:                api=all
DFMT0:              sa=bypass
DFMT1:              sa=bypass, pa=user

#==========================================================================#
# Board                                                                    #
#==========================================================================#

BOARD               DEBUG_UART_INSTANCE=0
BOARD               DEBUG_UART_BAUDRATE=115200
BOARD               I2C_INSTANCE=0
BOARD               I2C_BAUDRATE=100000

#==========================================================================#
# SM M33                                                               #
#==========================================================================#

LM0                 name="SM", rpc=none, boot=1, did=2, safe=feenv
OWNER:              perm=rw, api=all

MODE                msel=1, boot=1

DFMT0:              sa=bypass
DFMT1:              sa=secure, pa=privileged

#==========================================================================#
# M7                                                                  #
#==========================================================================#

LM1                 name="TEST", rpc=scmi, boot=2, did=4, safe=seenv

DFMT0:              sa=secure
DFMT1:              sa=secure, pa=privileged
OWNER:              perm=rw, api=all

# RPC Interface
SCMI_AGENT0         name="TEST"
MAILBOX             type=loopback
CHANNEL             db=0, xport=smt, rpc=scmi, type=a2p, test=default
CHANNEL             db=1, xport=smt, rpc=scmi, type=p2a_notify

# API
SYS                 ALL
