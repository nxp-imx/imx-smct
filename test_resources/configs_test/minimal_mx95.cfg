## Minimal MX95 configuration for SMCT test fixtures
## Use this as a base for test-specific configs via: include minimal_mx95.cfg

MAKE    soc=MIMX95, board=mcimx95evk, build=gcc_cross
DOX     name=MINIMAL_MX95, desc="Minimal MX95 Test Configuration"

include ../devices/MIMX95/configtool/device.cfg

# Common access templates
NOTIFY:             api=notify
GET:                api=get
SET:                api=set
PRIV:               api=priv
ALL:                api=all
DFMT0:              sa=bypass
DFMT1:              sa=bypass, pa=user

#==========================================================================#
# Board                                                                    #
#==========================================================================#

BOARD               DEBUG_UART_INSTANCE=0
BOARD               DEBUG_UART_BAUDRATE=115200
BOARD               I2C_INSTANCE=0
BOARD               I2C_BAUDRATE=100000

DOM0                name="ELE", did=0

LM0                 name="SM", rpc=none, boot=1, did=2, safe=feenv

MODE                msel=1, boot=1

DFMT0:              sa=secure
DFMT1:              sa=secure, pa=privileged
OWNER:              perm=sec_rw, api=all

M33P                 OWNER

LM1                 name="TEST", rpc=scmi, boot=2, did=4

DFMT0:              sa=secure
DFMT1:              sa=secure, pa=privileged
OWNER:              perm=rw, api=all

# SCMI setup
SCMI_AGENT0         name="TEST"
MAILBOX             type=mu, mu=9, test=0
CHANNEL             db=0, xport=smt, rpc=scmi, type=a2p, test=default
CHANNEL             db=1, xport=smt, rpc=scmi, type=p2a_notify

# API
SYS                 ALL
FUSA                ALL

# Resources
M7P                 OWNER
