[pytest]
# Parallelize with pytest-xdist. Note: the VS Code Python Test Explorer's
# result IPC does not cope with xdist on Windows (it fails with a
# "named pipe ... No such file or directory" error). VS Code settings live in
# the gitignored .vscode/settings.json, so a fresh clone has none by default;
# if you enable pytest in the Test Explorer, add "-p", "no:xdist" to
# "python.testing.pytestArgs" to disable xdist for Test Explorer runs only.
# This does not affect terminal/codecheck/CI runs, which keep -n auto.
addopts = -n auto --dist worksteal -m "not generated and not extended"
markers =
    regression: end-to-end Perl parity comparison (requires Perl + imx-sm)
    firmware: tests requiring imx-sm firmware root directory (no Perl)
    generated: long-running generated/fuzz configs (run with: pytest -m generated -n 0 -o "addopts=")
    extended: redundant or long-running parity CFGs excluded by default (run with: pytest -m extended)
# Log to a file artifact instead of streaming to the console: live-CLI logging
# (log_cli) leaks every logger.error/warning from passing negative tests to
# stdout, which the CI log parser flags as false-positive errors.
#
# Under xdist each worker writes to its own file (e.g. pytest_gw0.log) to
# avoid clobbering. At session end the controller merges them back into the
# base path below so CI always reads a single reports/pytest.log.
# See tests/conftest.py for the split + merge hooks.
log_cli = 0
log_file = reports/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S
