[pytest]
addopts = -n auto -m "not generated and not extended"
markers =
    regression: end-to-end Perl parity comparison (requires Perl + imx-sm)
    firmware: tests requiring imx-sm firmware root directory (no Perl)
    generated: long-running generated/fuzz configs (run with: pytest -m generated -n 0 -o "addopts=")
    extended: redundant or long-running parity CFGs excluded by default (run with: pytest -m extended)
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format=%Y-%m-%d %H:%M:%S
