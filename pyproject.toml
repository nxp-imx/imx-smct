[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smct"
dynamic = ["version"]
description = "System Manager Configuration Tool for NXP SM firmware"
readme = "readme.md"
authors = [{ name = "NXP Semiconductors", email = "mcux_config_tools_data_core@NXP1.onmicrosoft.com" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastjsonschema>=2.18.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
[project.scripts]
smct = "smct.smct:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["smct*"]
exclude = ["tests*", "test_resources*", "smct.py"]
[project.optional-dependencies]
dev = [
    "black>=24.3.0",
    "isort>=5.13.2",
    "mypy>=1.10",
    "ruff>=0.6.0",
    "nxp_codecheck>=0.3.16",
    "pydocstyle>=6.3.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools.package-data]
smct = ["../sm_model/**/*.json", "validation/schemas/*.json"]

[tool.setuptools.dynamic]
version = {attr = "smct._version.__version__"}

[project.urls]
Code = "https://github.com/nxp-imx/imx-smct/"
Documentation = "https://github.com/nxp-imx/imx-smct/blob/main/readme.md"

[tool.black]
line-length = 160
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 160
force_alphabetical_sort_within_sections = true
src_paths = ["smct", "tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_incomplete_stub = true
disallow_untyped_defs = true
mypy_path = "stubs"
cache_dir = ".cache/.mypy_cache"
implicit_reexport = false
strict_equality = true
strict_optional = true
no_implicit_optional = true
[[tool.mypy.overrides]]
module = [
    "fastjsonschema.*",
]
ignore_missing_imports = true
[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pydocstyle]
convention = "google"
add_ignore = "D105, D107"
match = '(?!test_|_version|smct\.py).*\.py'
match_dir = '(?!\.|venv|reports|__pycache__|tests|distribution).*'

[tool.gitcov]
skip-files = ""
repo-path = "."
module = "codecheck"
coverage-report = "reports/coverage.xml"
coverage-cutoff = 0.8
parent-branch = "origin/26.09/integration"
include-merges = 0
verbose = 0
debug = 0
full-file-test = 0

[tool.nxp_codecheck]
git_parent_branch = "origin/26.09/integration"
output_directory = "reports"
default_check_paths = ["smct", "tests"]

checkers = [
    { "pytest" = { timeout = 4000 } },
    { "gitcov" = { timeout = 300 } },
    { "pylint" = { timeout = 300 } },
    { "mypy" = { timeout = 300 } },
    { "pydocstyle" = { timeout = 200, check_paths = ["smct"] } },
    "ruff",
    { "radon_c" = { info_only = true, timeout = 60 } },
    { "radon_d" = { timeout = 60, info_only = true } },
    { "radon_mi" = { timeout = 60, info_only = true } },
    { "black" = { timeout = 300 } },
    { "isort" = { timeout = 60 } },
    "copyright",
    "py_headers",
    { "cyclic" = { timeout = 200 } },
    { "bandit" = { timeout = 100, info_only = true, check_paths = ["smct"] } },
]
 
[tool.copyright]
excluded_files = [".*/*", "reports/*"]
